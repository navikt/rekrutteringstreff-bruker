apiVersion: nais.io/v1alpha1
kind: Application

metadata:
  labels:
    team: toi
  name: rekrutteringstreff-bruker
  namespace: toi
spec:
  observability:
    autoInstrumentation:
      enabled: true
      runtime: nodejs
    logging:
      destinations:
        - id: loki
        - id: elastic
      enabled: true
  replicas:
    max: 2
    min: 1
  image: {{ image }}
  ingresses:
    - {{ NEXT_PUBLIC_BASE_URL }}
  port: 3000
  startup:
    path: /rekrutteringstreff/api/isready
    initialDelay: 5
    periodSeconds: 2
    failureThreshold: 30
    timeout: 1
  readiness:
    path: /rekrutteringstreff/api/isready
    initialDelay: 0
    periodSeconds: 5
    failureThreshold: 3
    timeout: 1
  liveness:
    path: /rekrutteringstreff/api/isalive
    initialDelay: 0
    periodSeconds: 10
    failureThreshold: 3
    timeout: 1
  resources:
    limits:
      memory: 768Mi
    requests:
      cpu: 200m
      memory: 512Mi
  idporten:
    enabled: true
    sidecar:
      enabled: true
      level: Level3
  tokenx:
    enabled: true
  accessPolicy:
     outbound:
        rules:
          - application: rekrutteringstreff-minside-api
          - application: nav-dekoratoren
            namespace: personbruker
  env:
    - name: NEXT_PUBLIC_BASE_URL
      value: {{ NEXT_PUBLIC_BASE_URL }}
    - name: REKRUTTERINGSTREFF_MINSIDE_API
      value: http://rekrutteringstreff-minside-api
    - name: NEXT_PUBLIC_LOGIN_URL
      value: {{ NEXT_PUBLIC_LOGIN_URL }}
    - name: NEXT_PUBLIC_SESSION_URL
      value: {{ NEXT_PUBLIC_SESSION_URL }}
