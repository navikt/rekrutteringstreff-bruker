name: Bygg og Deploy Rekrutteringstreff-bruker
on:
  push:
  workflow_dispatch: # Legger til mulighet for manuell kjøring

jobs:
  build-and-deploy:
    name: 🤖
    uses: navikt/toi-frontend-workflows/.github/workflows/build-and-deploy-nextjs.yaml@v3.5
    with:
      cdn-upload: true
      baseimage: europe-north1-docker.pkg.dev/cgr-nav/pull-through/nav.no/node:24
      playwright-command: >-
        pnpm exec playwright install --with-deps firefox webkit &&
        pnpm run test
      playwright-github-report: true
      playwright-shards: 4
      dev-vars-path: '.nais/dev-gcp.json'
      prod-vars-path: '.nais/prod-gcp.json'
      deploy-dev-branch: 'tydeligere-melding-ikke-invitert'
    secrets: inherit
    permissions:
      actions: write
      contents: write
      id-token: write
      pages: write
