allowBuilds:
  msw: false
  puppeteer: false
  sharp: false
  unrs-resolver: false
packages:
  - '.'
minimumReleaseAge: 4320 # minutter (3 dager)
minimumReleaseAgeExclude:
  - '@navikt/*'
ignoreScripts: true
blockExoticSubdeps: true
# GitHub Packages mangler peerDependenciesMeta som finnes i pakkens package.json.
packageExtensions:
  '@navikt/browserslist-config-public@0.3.0':
    peerDependenciesMeta:
      astro:
        optional: true
      vite:
        optional: true
registries:
  '@navikt': https://npm.pkg.github.com
